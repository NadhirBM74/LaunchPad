name: Release LaunchPad

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version (ex: v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build LaunchPad (Release)
        run: |
          xcodebuild -project LaunchPad.xcodeproj \
                     -scheme LaunchPad \
                     -configuration Release \
                     -derivedDataPath ./build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     CODE_SIGNING_ALLOWED=NO

      - name: Create DMG / Archive
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p dist
          APP_PATH="./build/Build/Products/Release/LaunchPad.app"
          
          # Création du zip
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/LaunchPad-${VERSION}.zip"
          
          # Création du DMG simple
          hdiutil create -volname "LaunchPad" -srcfolder "$APP_PATH" -ov -format UDZO "dist/LaunchPad-${VERSION}.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: LaunchPad ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/LaunchPad-*.dmg
            dist/LaunchPad-*.zip
